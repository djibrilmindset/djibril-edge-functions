name: Scan de secrets

# Vérifier toutes les branches, les demandes de fusion et les lancements manuels.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Le code de retour du scanner fait échouer le job en cas de détection.
      - name: Rechercher les secrets littéraux
        run: python3 scripts/scan-secrets.py --tous
